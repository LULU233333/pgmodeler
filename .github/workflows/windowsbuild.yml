name: Windows build

on:
  push:
    branches: [ main, develop, 1.* ]
    tags: 1.*
    
  pull_request:
    branches: [ main, develop, 1.* ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        qt: ['6.x'] 
    
    defaults:
      run:
       shell: msys2 {0}

    steps:
    - uses: actions/checkout@v2
     
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: base-devel mingw-w64-x86_64-make mingw-w64-x86_64-clang mingw-w64-x86_64-postgresql mingw-w64-x86_64-qt6 mingw-w64-x86_64-qt6-tools
                     
    # Workaround: Instead of using $GITHUB_WORKSPACE in PREFIX we actually use the path converted to unix-like
    # since we're running the building inside msys2
    - name: Running qmake
      run: |
        cd $GITHUB_WORKSPACE;
        qmake-qt6 pgmodeler.pro -spec win32-clang-g++ -r PREFIX=D:/a/pgmodeler/pgmodeler/build \
          XML_INC=$(cygpath -m /mingw64/include/libxml2) \
          XML_LIB=$(cygpath -m /mingw64/bin/libxml2-2.dll) \
          PGSQL_INC=$(cygpath -m /mingw64/include) \
          PGSQL_LIB=$(cygpath -m /mingw64/bin/libpq.dll) \
          CONFIG+=debug

    - name: Building pgModeler
      run: mingw32-make -j6
     
    - name: Deploying pgModeler
      run: mingw32-make install

    - name: Deploy runtime dependencies
      run: |
        # 转换 Windows 路径到 Unix 路径
        BUILD_DIR=$(cygpath -u 'D:\a\pgmodeler\pgmodeler\build')
        EXE_PATH="$BUILD_DIR/pgmodeler.exe"
        
        # 自动部署 Qt 依赖
        windeployqt-qt6 --qmldir $GITHUB_WORKSPACE/src \
          --dir $BUILD_DIR \
          --compiler-runtime \
          --no-translations \
          $EXE_PATH

        # 手动部署 MinGW 运行时库
        MINGW_BIN=/mingw64/bin
        cp $MINGW_BIN/libgcc_s_seh-1.dll $BUILD_DIR
        cp $MINGW_BIN/libstdc++-6.dll $BUILD_DIR
        cp $MINGW_BIN/libwinpthread-1.dll $BUILD_DIR
        
        # 部署 PostgreSQL 客户端库
        cp $MINGW_BIN/libpq.dll $BUILD_DIR
        cp $MINGW_BIN/libssl-*.dll $BUILD_DIR
        cp $MINGW_BIN/libcrypto-*.dll $BUILD_DIR

        # 验证部署结果
        ls -l $BUILD_DIR

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pgmodeler-build
        path: |
          D:\a\pgmodeler\pgmodeler\build\**
        retention-days: 5
    
    - name: Download artifact (example)
      uses: actions/download-artifact@v4
      with:
        name: pgmodeler-build
        path: downloaded_build
